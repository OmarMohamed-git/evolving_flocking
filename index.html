<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evolving Flocking</title>
<style>
  /* --- page layout ---------------------------------------------------
     The page is a horizontal flexbox: a fixed-width sidebar on the left,
     and the canvas taking whatever is left over. 100vh means "100% of the
     viewport height", so the whole thing is exactly one screen tall. */
  html, body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #0b0f14;
    color: #d7e3ef;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
  }

  /* flex: none stops the sidebar from being squashed or stretched -
     it keeps its 260px whatever else happens. */
  #sidebar {
    flex: none;
    width: 260px;
    height: 100%;
    padding: 18px 16px;
    box-sizing: border-box;      /* padding counts inside the 260px */
    overflow-y: auto;
    background: #10161e;
    border-right: 1px solid rgba(120, 160, 200, 0.18);
  }

  /* flex: 1 means "take all the remaining width". */
  canvas {
    flex: 1;
    display: block;
  }

  /* --- sidebar text -------------------------------------------------- */
  h1 {
    margin: 0 0 2px;
    font-size: 14px;
  }

  .subtitle {
    margin: 0 0 18px;
    font-size: 11px;
    color: #8ba0b5;
  }

  h2 {
    margin: 18px 0 10px;
    padding-top: 14px;
    border-top: 1px solid rgba(120, 160, 200, 0.18);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8ba0b5;
  }

  h2:first-of-type {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }

  /* --- one slider row ------------------------------------------------ */
  .control {
    margin-bottom: 14px;
  }

  /* The label is a flexbox too: name pushed left, number pushed right. */
  .control label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .control .value {
    color: #7fd4ff;
    font-size: 11px;
    /* tabular-nums stops the number jittering as digits change width */
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    width: 100%;
    margin: 0;
    accent-color: #7fd4ff;
  }

  /* Small colour square next to the prey / predator labels. */
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 6px;
  }

  .dot.prey { background: #7fd4ff; }
  .dot.predator { background: #ff5c5c; }

  .note {
    margin-top: 20px;
    font-size: 11px;
    color: #5f7285;
    line-height: 1.5;
  }
</style>
</head>
<body>

<!-- ===================== SIDEBAR ===================== -->
<div id="sidebar">
  <h1>Evolving Flocking</h1>
  <p class="subtitle">Stage 1 — two populations, drifting.</p>

  <h2>Population</h2>

  <!-- Each control is: a label holding a name and a live value readout,
       then the slider itself.

       The id on the <input> is how JavaScript finds the slider.
       The id on the <span> is how it finds the number to update.
       min / max / step / value are plain HTML - no code needed for the
       slider to work as a slider. -->
  <div class="control">
    <label>
      <span><i class="dot prey"></i>Prey</span>
      <span class="value" id="preyCount-value">200</span>
    </label>
    <input type="range" id="preyCount" min="0" max="1000" step="10" value="200">
  </div>

  <div class="control">
    <label>
      <span><i class="dot predator"></i>Predators</span>
      <span class="value" id="predatorCount-value">3</span>
    </label>
    <input type="range" id="predatorCount" min="0" max="20" step="1" value="3">
  </div>

  <h2>Movement</h2>

  <div class="control">
    <label>
      <span>Speed</span>
      <span class="value" id="speed-value">100 px/s</span>
    </label>
    <input type="range" id="speed" min="0" max="300" step="5" value="100">
  </div>

  <p class="note">
    All three sliders are live. Predators behave exactly like prey for
    now - the only difference is the colour.
  </p>
</div>

<!-- ===================== CANVAS ===================== -->
<canvas id="canvas"></canvas>

<script>
// =====================================================================
// 1. Canvas setup
// =====================================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// The canvas no longer fills the window - the sidebar takes 260px of it.
// clientWidth / clientHeight are the size the browser has actually laid
// this element out at, after flexbox has done its work. That is what to
// measure, not window.innerWidth.
//
// Assigning to canvas.width sets the real pixel grid AND wipes the canvas
// blank, even when set to the value it already had. So every resize has
// to be followed by a redraw.
function fitToWindow() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}


// =====================================================================
// 2. Parameters
// =====================================================================

// Every tunable number lives in one object. The sliders write here, and
// the simulation reads from here. Nothing else talks to the sliders.
const params = {
  preyCount: 200,
  predatorCount: 3,
  speed: 100,      // pixels per SECOND (not per frame - see step 5)
};


// =====================================================================
// 3. Wire the sliders to it
// =====================================================================

// One function handles every slider, so adding a fourth is one line
// rather than another copy-pasted block.
//
//   id        - matches both the <input id="..."> and the <span id="...-value">
//   key       - which field of params to write into
//   format    - turns the number into the text shown beside the label
//   onChange  - optional extra work to do after params is updated
function bindSlider(id, key, format, onChange) {
  const input = document.getElementById(id);
  const output = document.getElementById(id + '-value');

  function apply() {
    // Slider values arrive as STRINGS - "200", not 200. Convert once,
    // here at the edge, so nothing downstream has to think about it.
    const value = Number(input.value);
    params[key] = value;
    output.textContent = format(value);

    // Speed needs no follow-up work: update() reads params.speed every
    // frame anyway. Population does, because a number changing is not
    // the same as boids appearing.
    if (onChange) onChange(value);
  }

  // 'input' fires continuously while dragging.
  // ('change' would only fire once, on release - less responsive.)
  input.addEventListener('input', apply);

  // Run once at startup so params and the readout match the slider.
  apply();
}


// =====================================================================
// 4. The populations
// =====================================================================

const SIZE = 10; // how big a triangle is, in pixels

const PREY_COLOUR = '#7fd4ff';
const PREDATOR_COLOUR = '#ff5c5c';

// Two separate lists rather than one list with a `type: 'prey'` field on
// each agent.
//
// The single-list version means every loop starts with a filter or an if,
// and the two species will diverge fast: predators get their own speed,
// their own steering, and eventually their own genome. Keeping them apart
// now means those differences have somewhere to live later.
//
// The cost is that anything both species do has to be written to work on
// either list - which is why the functions below take a list as an
// argument instead of reaching for a global.
const prey = [];
const predators = [];

// Build one boid: somewhere random, facing somewhere random.
//
// Direction is kept SEPARATE from speed, as a unit vector - a pair whose
// length is exactly 1. Velocity is then direction x speed, which is what
// lets the speed slider change how fast everything goes without touching
// which way anything is pointing.
function makeBoid() {
  // A full turn is 2*PI radians, so this covers every direction.
  // cos gives the x part, sin the y part, and together they always have
  // length 1 - exactly the unit vector wanted.
  const angle = Math.random() * Math.PI * 2;

  return {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    dirX: Math.cos(angle),
    dirY: Math.sin(angle),
  };
}

// Grow or shrink a population until it matches its slider.
//
// The obvious version - empty the array and rebuild it - would work, but
// 'input' fires on every pixel of slider drag. Dragging from 200 to 400
// would rebuild the whole population dozens of times, and every boid on
// screen would be scrapped and replaced with each twitch.
//
// Adding and removing only the difference means the boids already flying
// carry on undisturbed, and only the newcomers are new.
function syncPopulation(list, target) {
  while (list.length > target) list.pop();
  while (list.length < target) list.push(makeBoid());
}


// =====================================================================
// 5. Update - changes the numbers, touches no canvas
// =====================================================================

// dt is "delta time": how many SECONDS passed since the last frame.
//
// The tempting version is `b.x += b.dirX * params.speed`, with speed
// meaning pixels per frame. It breaks on a 144Hz monitor: 2.4x more
// frames per second means everything moves 2.4x faster. The simulation's
// physics would depend on the viewer's screen.
//
// Multiplying by dt makes speed mean pixels per second, the same
// everywhere. At 60fps dt is about 0.0167, so a speed of 100 moves 1.67
// pixels per frame; at 144fps it moves 0.69 - and both cover 100 pixels
// in one second.
function update(dt) {
  // Both species run through the same function because right now they
  // behave identically. The moment predators get their own speed or their
  // own steering, this is where they stop sharing it.
  moveAll(prey, dt);
  moveAll(predators, dt);
}

function moveAll(list, dt) {
  // Every boid gets the same dt. They are all living through the same
  // frame, so they all experience the same amount of time.
  for (const b of list) {
    b.x += b.dirX * params.speed * dt;
    b.y += b.dirY * params.speed * dt;
    wrap(b);
  }
}

// Toroidal world: leaving one edge means entering the opposite one.
// No walls, so nothing piles up in corners and a flock is never shaped
// by the boundary.
//
// The SIZE margin lets a boid slide fully off screen before reappearing,
// instead of its nose popping out of the far edge while its tail is still
// visible on this one.
function wrap(b) {
  if (b.x < -SIZE) b.x = canvas.width + SIZE;
  if (b.x > canvas.width + SIZE) b.x = -SIZE;
  if (b.y < -SIZE) b.y = canvas.height + SIZE;
  if (b.y > canvas.height + SIZE) b.y = -SIZE;
}


// =====================================================================
// 6. Draw - reads the numbers, changes nothing
// =====================================================================

// Nothing in here writes to a boid or to params. That separation is worth
// keeping strict: later the simulation needs to run with no drawing at all
// (for long data runs), and that only gives the same results if drawing
// has no side effects.
function draw() {
  // Repainting the background is what ERASES the previous frame. Without
  // it, every position every boid has ever occupied stays on screen and
  // the canvas fills with solid streaks.
  //
  // Note this happens ONCE, not once per boid. Doing it inside a loop
  // would erase each boid as the next one is drawn, leaving only the last.
  ctx.fillStyle = '#0b0f14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Predators are drawn last so they sit on top of the prey rather than
  // disappearing underneath them.
  drawAll(prey, PREY_COLOUR);
  drawAll(predators, PREDATOR_COLOUR);
}

function drawAll(list, colour) {
  // fillStyle is a setting, not an argument - it stays until changed.
  // Setting it once per species rather than once per boid is not just
  // tidier, it skips a couple of hundred pointless assignments a frame.
  ctx.fillStyle = colour;

  for (const b of list) drawBoid(b);
}

function drawBoid(b) {
  // save() snapshots the drawing state, restore() puts it back, so the
  // translate and rotate below apply only to this one boid. Without the
  // pair, every boid's rotation would stack onto the last one's.
  ctx.save();

  // Move the origin onto the boid, then turn the whole canvas to face its
  // direction of travel. The shape below is drawn as if pointing right,
  // and never needs to know about angles.
  ctx.translate(b.x, b.y);

  // atan2 turns a direction vector back into an angle.
  // NOTE THE ORDER: y first, then x. Backwards from what reading it aloud
  // suggests, and getting it wrong gives a shape that is mirrored and
  // rotated 90 degrees - with no error message.
  ctx.rotate(Math.atan2(b.dirY, b.dirX));

  ctx.beginPath();
  ctx.moveTo(SIZE, 0);                   // nose, out in front
  ctx.lineTo(-SIZE * 0.6, SIZE * 0.6);   // back corner
  ctx.lineTo(-SIZE * 0.6, -SIZE * 0.6);  // back corner
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}


// =====================================================================
// 7. The loop
// =====================================================================

// requestAnimationFrame(f) means "call f once, just before the next screen
// repaint". It is not a loop on its own - f has to book the next frame at
// the end of itself, which is what makes it run continuously.
//
// The browser passes f a timestamp in milliseconds. Subtracting the
// previous one gives how long that frame actually took, which is dt.
let lastTime = performance.now();

function frame(now) {
  let dt = (now - lastTime) / 1000;   // milliseconds -> seconds
  lastTime = now;

  // Switch to another tab and the browser stops calling this. Come back
  // 30 seconds later and dt is 30 - one update step that teleports every
  // boid across the screen. Capping it means a tab switch costs a small
  // pause instead of a jump.
  if (dt > 0.1) dt = 0.1;

  update(dt);
  draw();

  requestAnimationFrame(frame);   // book the next one
}


// =====================================================================
// 8. Start
// =====================================================================

// Resizing wipes the canvas, but the loop repaints immediately anyway,
// so there is no draw() call needed here.
window.addEventListener('resize', fitToWindow);

// ORDER MATTERS HERE.
//
// A <canvas> with no width/height attributes defaults to 300x150. Until
// fitToWindow() runs, that is what canvas.width reports - so anything that
// spawns boids before this line scatters them across a 300x150 box in the
// top-left corner, and they stay bunched there.
//
// bindSlider() calls its handler once at startup to sync params with the
// slider, and for preyCount that handler builds the population. So the
// binding has to happen AFTER the canvas has been given its real size.
fitToWindow();

// syncPopulation needs to know WHICH list to resize, so each of these
// wraps it in a small function that supplies the right one.
bindSlider('preyCount', 'preyCount', v => String(v), n => syncPopulation(prey, n));
bindSlider('predatorCount', 'predatorCount', v => String(v), n => syncPopulation(predators, n));
bindSlider('speed', 'speed', v => v + ' px/s');

requestAnimationFrame(frame);

</script>

</body>
</html>
