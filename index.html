<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evolving Flocking</title>
<style>
  /* --- page layout ---------------------------------------------------
     The page is a horizontal flexbox: a fixed-width sidebar on the left,
     and the canvas taking whatever is left over. 100vh means "100% of the
     viewport height", so the whole thing is exactly one screen tall. */
  html, body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #0b0f14;
    color: #d7e3ef;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
  }

  /* flex: none stops the sidebar from being squashed or stretched -
     it keeps its 260px whatever else happens. */
  #sidebar {
    flex: none;
    width: 260px;
    height: 100%;
    padding: 18px 16px;
    box-sizing: border-box;      /* padding counts inside the 260px */
    overflow-y: auto;
    background: #10161e;
    border-right: 1px solid rgba(120, 160, 200, 0.18);
  }

  /* flex: 1 means "take all the remaining width". */
  canvas {
    flex: 1;
    display: block;
  }

  /* --- sidebar text -------------------------------------------------- */
  h1 {
    margin: 0 0 2px;
    font-size: 14px;
  }

  .subtitle {
    margin: 0 0 18px;
    font-size: 11px;
    color: #8ba0b5;
  }

  h2 {
    margin: 18px 0 10px;
    padding-top: 14px;
    border-top: 1px solid rgba(120, 160, 200, 0.18);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8ba0b5;
  }

  h2:first-of-type {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }

  /* --- one slider row ------------------------------------------------ */
  .control {
    margin-bottom: 14px;
  }

  /* The label is a flexbox too: name pushed left, number pushed right. */
  .control label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .control .value {
    color: #7fd4ff;
    font-size: 11px;
    /* tabular-nums stops the number jittering as digits change width */
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    width: 100%;
    margin: 0;
    accent-color: #7fd4ff;
  }

  /* Small colour square next to the prey / predator labels. */
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 6px;
  }

  .dot.prey { background: #7fd4ff; }
  .dot.predator { background: #ff5c5c; }

  .note {
    margin-top: 20px;
    font-size: 11px;
    color: #5f7285;
    line-height: 1.5;
  }
</style>
</head>
<body>

<!-- ===================== SIDEBAR ===================== -->
<div id="sidebar">
  <h1>Evolving Flocking</h1>
  <p class="subtitle">Stage 1 — two populations, drifting.</p>

  <h2>Population</h2>

  <!-- Each control is: a label holding a name and a live value readout,
       then the slider itself.

       The id on the <input> is how JavaScript finds the slider.
       The id on the <span> is how it finds the number to update.
       min / max / step / value are plain HTML - no code needed for the
       slider to work as a slider. -->
  <div class="control">
    <label>
      <span><i class="dot prey"></i>Prey</span>
      <span class="value" id="preyCount-value">200</span>
    </label>
    <input type="range" id="preyCount" min="0" max="1000" step="10" value="200">
  </div>

  <div class="control">
    <label>
      <span><i class="dot predator"></i>Predators</span>
      <span class="value" id="predatorCount-value">3</span>
    </label>
    <input type="range" id="predatorCount" min="0" max="20" step="1" value="3">
  </div>

  <h2>Movement</h2>

  <div class="control">
    <label>
      <span>Speed</span>
      <span class="value" id="speed-value">100 px/s</span>
    </label>
    <input type="range" id="speed" min="0" max="300" step="5" value="100">
  </div>

  <p class="note">
    All three sliders are live. Predators behave exactly like prey for
    now - the only difference is the colour.
  </p>
</div>

<!-- ===================== CANVAS ===================== -->
<canvas id="canvas"></canvas>

<!-- The whole simulation, split by what changes together rather than by
     what things are. Load order IS the dependency graph with plain script
     tags: each file may only use things defined in a file above it, and
     getting it wrong gives a ReferenceError on load with no other hint.

       vector.js  pure maths, depends on nothing
       config.js  the tunable numbers
       agent.js   one boid: what it is, how it moves      (needs Vector2)
       world.js   the populations and one tick of time    (needs makeBoid)
       render.js  drawing                                 (reads the world)
       main.js    canvas, sliders, frame loop             (needs all of it)

     Nothing points back up that list. render.js reads the world and never
     writes to it, so the simulation runs identically with the drawing
     removed - which is what stage 5's headless data runs need. -->
<script src="src/vector.js"></script>
<script src="src/config.js"></script>
<script src="src/agent.js"></script>
<script src="src/world.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>

</body>
</html>
