<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evolving Flocking</title>
<style>
  /* --- page layout ---------------------------------------------------
     The page is a horizontal flexbox: a fixed-width sidebar on the left,
     and the canvas taking whatever is left over. 100vh means "100% of the
     viewport height", so the whole thing is exactly one screen tall. */
  html, body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #0b0f14;
    color: #d7e3ef;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
  }

  /* flex: none stops the sidebar from being squashed or stretched -
     it keeps its 260px whatever else happens. */
  #sidebar {
    flex: none;
    width: 260px;
    height: 100%;
    padding: 18px 16px;
    box-sizing: border-box;      /* padding counts inside the 260px */
    overflow-y: auto;
    background: #10161e;
    border-right: 1px solid rgba(120, 160, 200, 0.18);
  }

  /* flex: 1 means "take all the remaining width". */
  canvas {
    flex: 1;
    display: block;
  }

  /* --- sidebar text -------------------------------------------------- */
  h1 {
    margin: 0 0 2px;
    font-size: 14px;
  }

  .subtitle {
    margin: 0 0 18px;
    font-size: 11px;
    color: #8ba0b5;
  }

  h2 {
    margin: 18px 0 10px;
    padding-top: 14px;
    border-top: 1px solid rgba(120, 160, 200, 0.18);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8ba0b5;
  }

  h2:first-of-type {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }

  /* --- one slider row ------------------------------------------------ */
  .control {
    margin-bottom: 14px;
  }

  /* The label is a flexbox too: name pushed left, number pushed right. */
  .control label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .control .value {
    color: #7fd4ff;
    font-size: 11px;
    /* tabular-nums stops the number jittering as digits change width */
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    width: 100%;
    margin: 0;
    accent-color: #7fd4ff;
  }

  /* Small colour square next to the prey / predator labels. */
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 6px;
  }

  .dot.prey { background: #7fd4ff; }
  .dot.predator { background: #ff5c5c; }

  .note {
    margin-top: 20px;
    font-size: 11px;
    color: #5f7285;
    line-height: 1.5;
  }
</style>
</head>
<body>

<!-- ===================== SIDEBAR ===================== -->
<div id="sidebar">
  <h1>Evolving Flocking</h1>
  <p class="subtitle">Stage 1 — one boid, moving.</p>

  <h2>Population</h2>

  <!-- Each control is: a label holding a name and a live value readout,
       then the slider itself.

       The id on the <input> is how JavaScript finds the slider.
       The id on the <span> is how it finds the number to update.
       min / max / step / value are plain HTML - no code needed for the
       slider to work as a slider. -->
  <div class="control">
    <label>
      <span><i class="dot prey"></i>Prey</span>
      <span class="value" id="preyCount-value">200</span>
    </label>
    <input type="range" id="preyCount" min="0" max="1000" step="10" value="200">
  </div>

  <div class="control">
    <label>
      <span><i class="dot predator"></i>Predators</span>
      <span class="value" id="predatorCount-value">3</span>
    </label>
    <input type="range" id="predatorCount" min="0" max="20" step="1" value="3">
  </div>

  <h2>Movement</h2>

  <div class="control">
    <label>
      <span>Speed</span>
      <span class="value" id="speed-value">100 px/s</span>
    </label>
    <input type="range" id="speed" min="0" max="300" step="5" value="100">
  </div>

  <p class="note">
    Speed is live. Prey and predator counts are still just numbers -
    nothing reads them yet.
  </p>
</div>

<!-- ===================== CANVAS ===================== -->
<canvas id="canvas"></canvas>

<script>
// =====================================================================
// 1. Canvas setup
// =====================================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// The canvas no longer fills the window - the sidebar takes 260px of it.
// clientWidth / clientHeight are the size the browser has actually laid
// this element out at, after flexbox has done its work. That is what to
// measure, not window.innerWidth.
//
// Assigning to canvas.width sets the real pixel grid AND wipes the canvas
// blank, even when set to the value it already had. So every resize has
// to be followed by a redraw.
function fitToWindow() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}


// =====================================================================
// 2. Parameters
// =====================================================================

// Every tunable number lives in one object. The sliders write here, and
// the simulation reads from here. Nothing else talks to the sliders.
const params = {
  preyCount: 200,
  predatorCount: 3,
  speed: 100,      // pixels per SECOND (not per frame - see step 5)
};


// =====================================================================
// 3. Wire the sliders to it
// =====================================================================

// One function handles every slider, so adding a fourth is one line
// rather than another copy-pasted block.
//
//   id      - matches both the <input id="..."> and the <span id="...-value">
//   key     - which field of params to write into
//   format  - turns the number into the text shown beside the label
function bindSlider(id, key, format) {
  const input = document.getElementById(id);
  const output = document.getElementById(id + '-value');

  function apply() {
    // Slider values arrive as STRINGS - "200", not 200. Without Number()
    // here, params.speed * dt would still work (JavaScript would coerce it)
    // but params.speed + 1 would give "1001". Convert once, at the edge.
    const value = Number(input.value);
    params[key] = value;
    output.textContent = format(value);
  }

  // 'input' fires continuously while dragging.
  // ('change' would only fire once, on release - less responsive.)
  input.addEventListener('input', apply);

  // Run once at startup so params and the readout match the slider.
  apply();
}

bindSlider('preyCount', 'preyCount', v => String(v));
bindSlider('predatorCount', 'predatorCount', v => String(v));
bindSlider('speed', 'speed', v => v + ' px/s');


// =====================================================================
// 4. The state being simulated
// =====================================================================

const SIZE = 20; // how big the triangle is, in pixels

// Position, and the direction it is heading in.
//
// Direction is kept SEPARATE from speed, as a unit vector - a pair whose
// length is exactly 1. Velocity is then just direction x speed.
//
// The alternative is storing velocity directly as (vx, vy) and rescaling
// it whenever the slider moves. Keeping them apart means the slider can
// change speed without ever touching which way the triangle is pointing.
const boid = {
  x: 0,
  y: 0,
  dirX: 1,   // pointing right to start with
  dirY: 0,
};

// Put it in the middle, facing a random direction.
function resetBoid() {
  boid.x = canvas.width / 2;
  boid.y = canvas.height / 2;

  // A random angle in radians. A full turn is 2*PI, so this covers every
  // direction. cos gives the x part of that direction, sin the y part,
  // and together they always have length 1 - exactly the unit vector wanted.
  const angle = Math.random() * Math.PI * 2;
  boid.dirX = Math.cos(angle);
  boid.dirY = Math.sin(angle);
}


// =====================================================================
// 5. Update - changes the numbers, touches no canvas
// =====================================================================

// dt is "delta time": how many SECONDS passed since the last frame.
//
// The tempting version is `boid.x += boid.dirX * params.speed`, with speed
// meaning pixels per frame. It breaks the moment someone opens this on a
// 144Hz monitor: their frames are 2.4x more frequent, so everything moves
// 2.4x faster. The simulation's physics would depend on the viewer's screen.
//
// Multiplying by dt makes speed mean pixels per second, which is the same
// everywhere. At 60fps dt is about 0.0167, so a speed of 100 moves 1.67
// pixels per frame; at 144fps it moves 0.69 - and both cover 100 pixels
// in one second.
function update(dt) {
  boid.x += boid.dirX * params.speed * dt;
  boid.y += boid.dirY * params.speed * dt;

  wrap();
}

// Toroidal world: leaving one edge means entering the opposite one.
// No walls, so nothing piles up in corners and a flock is never shaped
// by the boundary.
//
// The SIZE margin lets it slide fully off screen before reappearing,
// instead of the nose popping out of the far edge while the tail is
// still visible on this one.
function wrap() {
  if (boid.x < -SIZE) boid.x = canvas.width + SIZE;
  if (boid.x > canvas.width + SIZE) boid.x = -SIZE;
  if (boid.y < -SIZE) boid.y = canvas.height + SIZE;
  if (boid.y > canvas.height + SIZE) boid.y = -SIZE;
}


// =====================================================================
// 6. Draw - reads the numbers, changes nothing
// =====================================================================

// Nothing in here writes to `boid` or `params`. That separation is worth
// keeping strict: later the simulation needs to run with no drawing at all
// (for long data runs), and that only gives the same results if drawing
// has no side effects.
function draw() {
  // Repainting the whole background every frame is what ERASES the
  // triangle's previous position. Without it, every frame it has ever
  // occupied stays on screen and it smears a solid line across the canvas.
  ctx.fillStyle = '#0b0f14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();

  // Move the origin to the boid, then turn the whole canvas to face its
  // direction of travel. The shape below is drawn as if pointing right,
  // and never needs to know about angles.
  ctx.translate(boid.x, boid.y);

  // atan2 turns a direction vector back into an angle.
  // NOTE THE ORDER: y first, then x. Backwards from what reading it aloud
  // suggests, and getting it wrong gives a shape that is mirrored and
  // rotated 90 degrees - with no error message.
  ctx.rotate(Math.atan2(boid.dirY, boid.dirX));

  ctx.fillStyle = '#7fd4ff';

  ctx.beginPath();
  ctx.moveTo(SIZE, 0);                   // nose, out in front
  ctx.lineTo(-SIZE * 0.6, SIZE * 0.6);   // back corner
  ctx.lineTo(-SIZE * 0.6, -SIZE * 0.6);  // back corner
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}


// =====================================================================
// 7. The loop
// =====================================================================

// requestAnimationFrame(f) means "call f once, just before the next screen
// repaint". It is not a loop on its own - f has to book the next frame at
// the end of itself, which is what makes it run continuously.
//
// The browser passes f a timestamp in milliseconds. Subtracting the
// previous one gives the time that frame actually took, which is dt.
let lastTime = performance.now();

function frame(now) {
  let dt = (now - lastTime) / 1000;   // milliseconds -> seconds
  lastTime = now;

  // Switch to another tab and the browser stops calling this. Come back
  // 30 seconds later and dt is 30 - one update step that teleports the
  // boid across the screen. Capping it means a tab switch costs a small
  // pause instead of a jump.
  if (dt > 0.1) dt = 0.1;

  update(dt);
  draw();

  requestAnimationFrame(frame);   // book the next one
}


// =====================================================================
// 8. Start
// =====================================================================

// Resizing wipes the canvas, but the loop repaints immediately anyway,
// so there is no draw() call needed here now.
window.addEventListener('resize', fitToWindow);

fitToWindow();
resetBoid();
requestAnimationFrame(frame);

</script>

</body>
</html>
