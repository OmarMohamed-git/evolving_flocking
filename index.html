<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evolving Flocking</title>
<style>
  /* --- page layout ---------------------------------------------------
     The page is a horizontal flexbox: a fixed-width sidebar on the left,
     and the canvas taking whatever is left over. 100vh means "100% of the
     viewport height", so the whole thing is exactly one screen tall. */
  html, body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #0b0f14;
    color: #d7e3ef;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
  }

  /* flex: none stops the sidebar from being squashed or stretched -
     it keeps its 260px whatever else happens. */
  #sidebar {
    flex: none;
    width: 260px;
    height: 100%;
    padding: 18px 16px;
    box-sizing: border-box;      /* padding counts inside the 260px */
    overflow-y: auto;
    background: #10161e;
    border-right: 1px solid rgba(120, 160, 200, 0.18);
  }

  /* flex: 1 means "take all the remaining width". */
  canvas {
    flex: 1;
    display: block;
  }

  /* --- sidebar text -------------------------------------------------- */
  h1 {
    margin: 0 0 2px;
    font-size: 14px;
  }

  .subtitle {
    margin: 0 0 18px;
    font-size: 11px;
    color: #8ba0b5;
  }

  h2 {
    margin: 18px 0 10px;
    padding-top: 14px;
    border-top: 1px solid rgba(120, 160, 200, 0.18);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8ba0b5;
  }

  h2:first-of-type {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }

  /* --- one slider row ------------------------------------------------ */
  .control {
    margin-bottom: 14px;
  }

  /* The label is a flexbox too: name pushed left, number pushed right. */
  .control label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .control .value {
    color: #7fd4ff;
    font-size: 11px;
    /* tabular-nums stops the number jittering as digits change width */
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    width: 100%;
    margin: 0;
    accent-color: #7fd4ff;
  }

  /* Small colour square next to the prey / predator labels. */
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 6px;
  }

  .dot.prey { background: #7fd4ff; }
  .dot.predator { background: #ff5c5c; }

  .note {
    margin-top: 20px;
    font-size: 11px;
    color: #5f7285;
    line-height: 1.5;
  }
</style>
</head>
<body>

<!-- ===================== SIDEBAR ===================== -->
<div id="sidebar">
  <h1>Evolving Flocking</h1>
  <p class="subtitle">Stage 1 — controls only, nothing wired up yet.</p>

  <h2>Population</h2>

  <!-- Each control is: a label holding a name and a live value readout,
       then the slider itself.

       The id on the <input> is how JavaScript finds the slider.
       The id on the <span> is how it finds the number to update.
       min / max / step / value are plain HTML - no code needed for the
       slider to work as a slider. -->
  <div class="control">
    <label>
      <span><i class="dot prey"></i>Prey</span>
      <span class="value" id="preyCount-value">200</span>
    </label>
    <input type="range" id="preyCount" min="0" max="1000" step="10" value="200">
  </div>

  <div class="control">
    <label>
      <span><i class="dot predator"></i>Predators</span>
      <span class="value" id="predatorCount-value">3</span>
    </label>
    <input type="range" id="predatorCount" min="0" max="20" step="1" value="3">
  </div>

  <h2>Movement</h2>

  <div class="control">
    <label>
      <span>Speed</span>
      <span class="value" id="speed-value">100 px/s</span>
    </label>
    <input type="range" id="speed" min="0" max="300" step="5" value="100">
  </div>

  <p class="note">
    Sliders move and report their value, but nothing reads them yet.
    They write into a <code>params</code> object the simulation will use later.
  </p>
</div>

<!-- ===================== CANVAS ===================== -->
<canvas id="canvas"></canvas>

<script>
// =====================================================================
// 1. Canvas setup
// =====================================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// The canvas no longer fills the window - the sidebar takes 260px of it.
// clientWidth / clientHeight are the size the browser has actually laid
// this element out at, after flexbox has done its work. That is what to
// measure, not window.innerWidth.
//
// Assigning to canvas.width sets the real pixel grid AND wipes the canvas
// blank, even when set to the value it already had. So every resize has
// to be followed by a redraw.
function fitToWindow() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}


// =====================================================================
// 2. Parameters
// =====================================================================

// Every tunable number lives in one object. Right now nothing reads it -
// the sliders write here and the drawing ignores it. That is deliberate:
// this is the seam the simulation plugs into next, and having one place
// for all of it is what keeps a later change small.
const params = {
  preyCount: 200,
  predatorCount: 3,
  speed: 100,      // pixels per second
};


// =====================================================================
// 3. Wire the sliders to it
// =====================================================================

// One function handles every slider, so adding a fourth is one line
// rather than another copy-pasted block.
//
//   id      - matches both the <input id="..."> and the <span id="...-value">
//   key     - which field of params to write into
//   format  - turns the number into the text shown beside the label
function bindSlider(id, key, format) {
  const input = document.getElementById(id);
  const output = document.getElementById(id + '-value');

  // Named so it can be used twice: once now, once on every change.
  function apply() {
    // Slider values arrive as STRINGS - "200", not 200. Without Number()
    // here, params.preyCount + 1 would give "2001" instead of 201.
    const value = Number(input.value);
    params[key] = value;
    output.textContent = format(value);
  }

  // 'input' fires continuously while dragging.
  // ('change' would only fire once, on release - less responsive.)
  input.addEventListener('input', apply);

  // Run once at startup so params and the readout match the slider's
  // starting position, rather than trusting the numbers typed into the HTML.
  apply();
}

bindSlider('preyCount', 'preyCount', v => String(v));
bindSlider('predatorCount', 'predatorCount', v => String(v));
bindSlider('speed', 'speed', v => v + ' px/s');


// =====================================================================
// 4. Draw
// =====================================================================

const SIZE = 20; // how big the triangle is, in pixels

function draw() {
  // --- the field ---
  ctx.fillStyle = '#0b0f14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // --- the triangle ---
  // save() snapshots the drawing state, restore() puts it back, so the
  // translate below only applies to what is drawn between them.
  ctx.save();

  // Move the origin to the middle of the canvas.
  ctx.translate(canvas.width / 2, canvas.height / 2);

  ctx.fillStyle = '#7fd4ff';

  ctx.beginPath();
  // Nose along +x, back corners behind it, so the triangle points RIGHT.
  // An angle of 0 also points right, so adding a rotate() above this later
  // will aim it along its velocity without touching these numbers.
  ctx.moveTo(SIZE, 0);
  ctx.lineTo(-SIZE * 0.6, SIZE * 0.6);
  ctx.lineTo(-SIZE * 0.6, -SIZE * 0.6);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}


// =====================================================================
// 5. Start
// =====================================================================

window.addEventListener('resize', function () {
  fitToWindow();
  draw();
});

fitToWindow();
draw();
</script>

</body>
</html>
